<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Micro no Controle — o app do MEI</title>
<meta name="description" content="Caixa, fiado com cobrança por Pix no WhatsApp, agenda, orçamento, conferência da maquininha e do iFood e limite do MEI. Grátis, no seu celular.">
<meta name="theme-color" content="#0F3D3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Micro no Controle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0F3D3E;--deep2:#164f50;--mint:#2EC4B6;--mint-soft:#E3F6F3;--bg:#F3F7F6;--paper:#fff;--ink:#1A2628;--muted:#5A6A6D;
  --line:#D9E3E2;--yellow:#F5B942;--yellow-soft:#FFF4DC;--red:#C8443A;--red-soft:#FCE9E7;--green:#1E8C5A;--green-soft:#E3F4EA;
  --wa:#1FA855;--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px;--sh:0 1px 2px rgba(15,61,62,.06),0 4px 14px rgba(15,61,62,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:#0B6F68}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header.topo{background:var(--deep);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;display:flex;align-items:center;gap:12px}
header.topo .marca{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.topo .sub{font-size:13px;color:#BFE3DE;font-weight:500;display:block;font-family:var(--body)}
header.topo .voltar{color:#fff;font-size:15px;font-weight:600;padding:8px 10px 8px 0}
main{padding:16px}
h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:22px 0 10px}
.muted{color:var(--muted)}
.peq{font-size:14.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.hero{background:linear-gradient(160deg,var(--deep),var(--deep2));color:#fff;border:0}
.hero .lbl{color:#BFE3DE;font-size:14px;font-weight:600}
.hero .big{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-.02em;line-height:1.1;margin:2px 0 12px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpis div{background:rgba(255,255,255,.08);border-radius:12px;padding:9px 10px}
.kpis b{display:block;font-size:16px;white-space:nowrap}
.kpis span{font-size:12.5px;color:#BFE3DE}
.alerta{display:flex;gap:12px;align-items:center;border-radius:14px;padding:13px 14px;margin-top:10px;border:1px solid var(--line);background:var(--paper)}
.alerta .ic{font-size:22px;line-height:1;flex:none}
.alerta .tx{flex:1;min-width:0}
.alerta .tx b{display:block;font-size:15.5px}
.alerta .tx span{font-size:14px;color:var(--muted)}
.alerta.am{background:var(--yellow-soft);border-color:#F2DCA5}
.alerta.vm{background:var(--red-soft);border-color:#F1C8C3}
.alerta.vd{background:var(--green-soft);border-color:#BFE3CD}
.alerta.mt{background:var(--mint-soft);border-color:#BDE8E2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--deep);color:#fff;text-decoration:none}
.btn.mint{background:var(--mint);color:var(--deep)}
.btn.wa{background:var(--wa);color:#fff}
.btn.claro{background:var(--mint-soft);color:var(--deep)}
.btn.linha{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.verm{background:var(--red-soft);color:var(--red)}
.btn.peq{min-height:38px;padding:0 12px;font-size:14.5px;border-radius:11px}
.btn.cheio{width:100%}
.btn[disabled]{opacity:.5}
.linhaBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.linhaBtns .btn{flex:1}
.lista{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-child{border-top:0}
.item .av{width:40px;height:40px;border-radius:50%;background:var(--mint-soft);color:var(--deep);display:grid;place-items:center;font-weight:800;flex:none}
.item .meio{flex:1;min-width:0}
.item .meio b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meio span{font-size:13.5px;color:var(--muted)}
.item .val{font-weight:700;white-space:nowrap;text-align:right}
.val.mais{color:var(--green)} .val.menos{color:var(--red)} .val.neutro{color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--mint-soft);color:var(--deep)}
.tag.vm{background:var(--red-soft);color:var(--red)} .tag.am{background:var(--yellow-soft);color:#8a5a00}
.vazio{text-align:center;padding:28px 18px;color:var(--muted)}
.vazio .ic{font-size:40px;display:block;margin-bottom:6px}
nav.barra{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.barra .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.barra a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 2px}
nav.barra a .i{font-size:21px;line-height:1}
nav.barra a.on{color:var(--deep)}
nav.barra .mais{display:flex;justify-content:center}
nav.barra .mais button{width:58px;height:58px;border-radius:50%;background:var(--mint);color:var(--deep);font-size:34px;font-weight:700;line-height:1;margin-top:-26px;box-shadow:0 6px 16px rgba(46,196,182,.45);border:4px solid var(--bg)}
/* formulários */
label.campo{display:block;margin-top:14px}
label.campo>span{display:block;font-size:14.5px;font-weight:600;margin-bottom:6px}
.inp{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:13px;padding:10px 14px;background:#fff;font-size:17px}
.inp:focus{border-color:var(--mint);outline:none}
textarea.inp{min-height:80px;resize:vertical}
.valor{font-family:var(--display);font-weight:800;font-size:40px;text-align:center;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:15px}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--mint-soft);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:11px;font-weight:700;font-size:14.5px;color:var(--deep)}
.seg button.on{background:#fff;box-shadow:var(--sh)}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--deep)}
/* folha (bottom sheet) */
.veu{position:fixed;inset:0;background:rgba(10,30,31,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.folha{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:sobe .2s ease-out}
.folha .pega{width:44px;height:5px;border-radius:5px;background:#C5D2D1;margin:0 auto 12px}
.folha h1{font-size:23px;margin-bottom:4px}
.folha .fechar{float:right;font-size:15px;font-weight:700;color:var(--muted);padding:6px 0 6px 10px}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:80;max-width:90vw;text-align:center;animation:fade .2s}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ferr{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;min-height:118px;text-decoration:none;color:var(--ink)}
.ferr .i{font-size:26px}
.ferr b{font-size:15.5px;line-height:1.25}
.ferr span{font-size:13px;color:var(--muted);line-height:1.3}
.barraProg{height:14px;background:var(--mint-soft);border-radius:10px;overflow:hidden;margin:10px 0 6px}
.barraProg i{display:block;height:100%;background:var(--mint);border-radius:10px}
.barraProg.am i{background:var(--yellow)} .barraProg.vm i{background:var(--red)}
.pixbox{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;color:var(--muted);margin-top:10px}
.qr{display:block;margin:12px auto 0;width:220px;max-width:70%;image-rendering:pixelated;border-radius:8px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.onb{min-height:100vh;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 22px 28px;max-width:560px;margin:0 auto}
.onb .passos{display:flex;gap:6px;margin-bottom:22px}
.onb .passos i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.onb .passos i.on{background:var(--mint)}
.onb h1{font-size:29px;margin-bottom:8px}
.onb .fim{margin-top:auto;padding-top:22px}
.setores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.setores button{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 12px;text-align:left;font-weight:700;font-size:15.5px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.setores button .i{font-size:26px}
.setores button.on{border-color:var(--deep);background:var(--mint-soft);box-shadow:0 0 0 2px var(--deep) inset}
.dica{background:var(--mint-soft);border-radius:14px;padding:12px 14px;font-size:14.5px;margin-top:14px;color:var(--deep)}
.aviso{background:var(--yellow-soft);border-radius:14px;padding:12px 14px;font-size:14.5px;margin-top:14px;color:#6b4800}
.drop{display:block;position:relative;border:2px dashed #A9C9C5;border-radius:16px;padding:22px 14px;text-align:center;background:#fff;margin-top:12px;cursor:pointer}
.drop input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.drop b{display:block;font-size:16.5px}
.achado{font-family:var(--display);font-weight:800;font-size:40px;color:var(--red);letter-spacing:-.02em;line-height:1.1}
details.como{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px}
details.como summary{font-weight:700;cursor:pointer}
details.como ol,details.como ul{padding-left:20px;margin-top:8px}
.rodape{text-align:center;font-size:13px;color:var(--muted);margin:26px 0 6px}
#impressao{display:none}
@media print{
  body.imprimindo .app, body.imprimindo nav.barra, body.imprimindo .veu, body.imprimindo .toast{display:none!important}
  body.imprimindo #impressao{display:block}
  body{background:#fff}
}
#impressao{font-family:Arial,sans-serif;color:#000;font-size:13px;padding:10px}
#impressao h3{text-align:center;font-size:15px;margin-bottom:12px}
#impressao table{width:100%;border-collapse:collapse;margin-top:6px}
#impressao td,#impressao th{border:1px solid #000;padding:6px 8px;text-align:left}
#impressao td.n{text-align:right;white-space:nowrap}
@media (min-width:600px){main{padding:20px}}
</style>
</head>
<body>
<div class="app" id="app"><main id="tela"><p class="muted" style="padding:40px 0;text-align:center">Carregando…</p></main></div>
<nav class="barra" id="barra" hidden></nav>
<div id="impressao"></div>
<noscript><p style="padding:20px">Ative o JavaScript para usar o app.</p></noscript>
<script src="../assets/pixel.js" defer></script>
<script src="../auditoria-maquininha/motor.js"></script>
<script src="pix.js"></script>
<script src="ifood.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
