<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://vuwxwcuafazwnslbxaqk.supabase.co wss://vuwxwcuafazwnslbxaqk.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcar horário</title>
<meta name="description" content="Escolha o serviço e um horário livre. Sem cadastro e sem instalar nada.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F3D3E">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fontes.css">
<style>
:root{
  --deep:#0F3D3E;--deep2:#164f50;--mint:#2EC4B6;--mint-soft:#E3F6F3;--bg:#F3F7F6;--paper:#fff;--ink:#1A2628;--muted:#5A6A6D;
  --line:#D9E3E2;--yellow:#F5B942;--yellow-soft:#FFF4DC;--red:#C8443A;--red-soft:#FCE9E7;--green:#1E8C5A;--green-soft:#E3F4EA;--wa:#1FA855;
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{background:linear-gradient(160deg,var(--deep),var(--deep2));color:#fff;padding:22px 16px 26px}
header .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#BFE3DE}
header h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.02em;margin-top:4px}
header p{color:#D8EFEC;font-size:15px;margin-top:6px}
main{max-width:560px;margin:0 auto;padding:6px 16px 60px}
h2{font-family:var(--display);font-size:20px;font-weight:700;margin:22px 0 10px}
h2 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--deep);color:#fff;font-size:14px;margin-right:8px;vertical-align:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.serv{display:flex;flex-direction:column;gap:8px}
.serv button{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;min-height:56px}
.serv button b{font-size:16.5px}
.serv button span{font-size:14px;color:var(--muted);white-space:nowrap}
.serv button.on{border-color:var(--deep);background:var(--mint-soft)}
.dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:none;width:64px;padding:8px 0;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);text-align:center}
.dias button small{display:block;font-size:12.5px;color:var(--muted);text-transform:capitalize}
.dias button b{display:block;font-size:20px;font-family:var(--display)}
.dias button.on{background:var(--deep);border-color:var(--deep);color:#fff}
.dias button.on small{color:#BFE3DE}
.dias button:disabled{opacity:.4}
.horas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.horas button{min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-weight:700;font-size:16px}
.horas button.on{background:var(--deep);border-color:var(--deep);color:#fff}
label{display:block;margin-top:12px}
label span{display:block;font-size:14.5px;font-weight:600;margin-bottom:6px}
.inp{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:13px;padding:10px 14px;background:#fff;font-size:17px}
textarea.inp{min-height:70px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:17px;background:var(--deep);color:#fff;text-decoration:none;margin-top:16px}
.btn.mint{background:var(--mint);color:var(--deep)}
.btn.wa{background:var(--wa)}
.btn.linha{background:#fff;color:var(--deep);border:1.5px solid var(--line)}
.btn:disabled{opacity:.6}
.muted{color:var(--muted)}
.peq{font-size:14px}
.vazio{color:var(--muted);text-align:center;padding:18px 8px}
.aviso{background:var(--yellow-soft);border:1px solid #F2DCA5;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
.erro{background:var(--red-soft);border:1px solid #F1C8C3}
.ok{background:var(--green-soft);border:1px solid #BFE3CD}
.sug{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sug button{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--deep);background:#fff;font-weight:700}
.status{border-radius:var(--r);padding:16px;margin-top:14px}
.status b{display:block;font-size:18px}
.rod{text-align:center;font-size:13px;color:var(--muted);margin-top:30px}
.rod a{color:var(--muted)}
.esq{background:linear-gradient(90deg,#e8eeed,#f5f8f7,#e8eeed);background-size:200% 100%;animation:esq 1.2s infinite;border-radius:12px;height:46px}
@keyframes esq{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.esq{animation:none}}
</style>
</head>
<body>
<header><div class="k">Marcar horário</div><h1 id="nome">Carregando…</h1><p>Escolha o serviço e um horário livre. Sem cadastro.</p></header>
<main id="app"><div class="esq" style="margin-top:20px"></div></main>
<script src="../app/nuvem.js"></script>
<script src="agendar.js"></script>
</body>
</html>
